<head>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Miniver&family=Poppins:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Poppins", sans-serif;
        }

        /* Navbar Styling */
        header {
            background: #1e293b; /* Dark blue background */
            z-index: 5;
            width: 100%;
        }

        header .navbar {
            display: flex;
            padding: 20px;
            align-items: center;
            justify-content: space-between;
        }

        .navbar .nav-logo .logo-text {
            color: #fbbf24; /* Golden color */
            font-size: 40px;
            font-weight: 600;
        }

        .navbar .nav-menu {
            display: flex;
            gap: 10px;
        }

        .navbar .nav-menu .nav-link {
            color: #ffffff;
            padding: 10px 18px;
            background-color: transparent;
            border-radius: 30px;
            transition: 0.3s ease;
            font-weight: 500;
        }

        .navbar .nav-menu .nav-link:hover {
            background-color: #fbbf24; /* Golden color */
            color: #1e293b; /* Dark blue text */
        }

        /* Dropdown Menu Styling */
        .dropdown {
            position: relative;
            display: inline-block;
        }

        .dropdown .dropdown-menu {
            display: none;
            position: absolute;
            background-color: #1e293b; /* Dark blue */
            border-radius: 10px;
            padding: 10px 0;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            z-index: 10;
            opacity: 0;
            transform: translateY(-10px);
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .dropdown:hover .dropdown-menu {
            display: block;
            opacity: 1;
            transform: translateY(0);
        }

        .dropdown-menu .dropdown-item {
            padding: 10px 20px;
            color: #ffffff;
            text-align: left;
            transition: 0.3s ease;
        }

        .dropdown-menu .dropdown-item:hover {
            background-color: #fbbf24; /* Golden hover */
            color: #1e293b; /* Dark blue text */
        }

        /* General Styling */
        ul {
            list-style: none;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        button {
            cursor: pointer;
            border: none;
            background: none;
        }

        img {
            width: 100%;
        }

        .section-content {
            margin: 0 auto;
            padding: 0 10px;
        }

        main {
            flex: 1;
        }
    </style>
</head>

<body>
    <header>
        <nav class="navbar section-content">
            <a href="/" class="nav-logo">
                <h2 class="logo-text">👁 Glaucoma Detection</h2>
            </a>
            <ul class="nav-menu">
                <li class="nav-item">
                    <a href="/" class="nav-link">Home</a>
                </li>
                <li class="nav-item">
                    <a href="/predict" class="nav-link">Predict</a>
                </li>
                <li class="nav-item dropdown">
                    <a href="#" class="nav-link">Models</a>
                    <ul class="dropdown-menu">
                        <li class="dropdown-item">
                            <a href="/ViT">ViT</a>
                        </li>
                        <li class="dropdown-item">
                            <a href="/Resnet50">Resnet50</a>
                        </li>
                        <li class="dropdown-item">
                            <a href="/DenseNet121">DenseNet121</a>
                        </li>
                    </ul>
                </li>
                <li class="nav-item">
                    <a href="/about" class="nav-link">About Us</a>
                </li>
            </ul>
        </nav>
    </header>
    <main>
        <!-- Page content goes here -->
    </main>
</body>
